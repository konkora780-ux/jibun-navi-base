<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アプリロジック テスト（設定検証・ナビ開始状態遷移・検索結果のXSS安全性）</title>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding:20px; }
  h1 { font-size:18px; }
  #summary { font-size:16px; margin:12px 0; padding:10px; border-radius:6px; }
  #summary.pass { background:#1a3a1a; color:#3fb950; }
  #summary.fail { background:#3a1a1a; color:#f85149; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid #30363d; padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#161b22; }
  tr.pass td.result { color:#3fb950; }
  tr.fail td.result { color:#f85149; font-weight:bold; }
  td.detail { white-space:pre-wrap; font-family:monospace; font-size:12px; color:#8b949e; }
  #sandbox { display:none; }
</style>
</head>
<body>

<h1>アプリロジック テスト</h1>
<div id="summary">実行中…</div>
<table id="resultTable">
  <thead><tr><th>#</th><th>内容</th><th>結果</th><th>詳細</th></tr></thead>
  <tbody id="resultBody"></tbody>
</table>

<!-- renderDestResultItemのテスト用に実際にDOMへ挿入する非表示コンテナ -->
<ul id="sandbox"></ul>

<script type="module">
import { validateSettingValue, validateGroupConsistency } from '../js/config.js';
import { canStartNav } from '../js/nav/navGuard.js';
import { createNavSession } from '../js/nav/navSession.js';
import { renderDestResultItem } from '../js/ui/destResultsView.js';

const cases = [];
function test(description, fn) {
  cases.push({ description, fn });
}

// ---------- validateSettingValue ----------
test('GPS_ACCURACY.GOOD=20（正常値）は保存される', () => {
  const r = validateSettingValue('GPS_ACCURACY', 'GOOD', '20');
  assertEqual(r.valid, true, 'valid');
  assertEqual(r.value, 20, 'value');
});

test('REROUTE.MIN_INTERVAL_SECONDS=9（10秒未満）は保存されない', () => {
  const r = validateSettingValue('REROUTE', 'MIN_INTERVAL_SECONDS', '9');
  assertEqual(r.valid, false, 'valid');
});

test('REROUTE.MIN_INTERVAL_SECONDS=10（境界値）は保存される', () => {
  const r = validateSettingValue('REROUTE', 'MIN_INTERVAL_SECONDS', '10');
  assertEqual(r.valid, true, 'valid');
});

test('空欄は保存されない', () => {
  const r = validateSettingValue('GPS_ACCURACY', 'GOOD', '');
  assertEqual(r.valid, false, 'valid');
});

test('NaN(数値でない文字列)は保存されない', () => {
  const r = validateSettingValue('GPS_ACCURACY', 'GOOD', 'abc');
  assertEqual(r.valid, false, 'valid');
});

test('Infinityは保存されない', () => {
  const r = validateSettingValue('GPS_ACCURACY', 'GOOD', Infinity);
  assertEqual(r.valid, false, 'valid');
});

test('範囲外の値（LANE_CHANGE.CRITICAL_RATIO=1.5、max=1超）は保存されない', () => {
  const r = validateSettingValue('LANE_CHANGE', 'CRITICAL_RATIO', '1.5');
  assertEqual(r.valid, false, 'valid');
});

test('チェックボックス項目にtrue/false以外を渡すと保存されない', () => {
  const r = validateSettingValue('SMART_LANE_ENABLED_ROAD_CLASSES', 'motorway', 'true');
  assertEqual(r.valid, false, 'valid（文字列"true"はbooleanではない）');
});

test('チェックボックス項目にboolean falseを渡すと保存される', () => {
  const r = validateSettingValue('SMART_LANE_ENABLED_ROAD_CLASSES', 'motorway', false);
  assertEqual(r.valid, true, 'valid');
  assertEqual(r.value, false, 'value');
});

test('未知のグループ/キーは保存されない', () => {
  const r = validateSettingValue('NOT_A_GROUP', 'X', '1');
  assertEqual(r.valid, false, 'valid');
});

// ---------- validateGroupConsistency（複数項目間の矛盾チェック） ----------
test('GOOD=15, DEGRADED=30（正常）は整合性チェックに合格する', () => {
  const r = validateGroupConsistency('GPS_ACCURACY', { GOOD: 15, DEGRADED: 30 });
  assertEqual(r.valid, true, 'valid');
});

test('GOOD=30, DEGRADED=30（境界値・同値）は整合性チェックに合格する', () => {
  const r = validateGroupConsistency('GPS_ACCURACY', { GOOD: 30, DEGRADED: 30 });
  assertEqual(r.valid, true, 'valid');
});

test('GOOD=31, DEGRADED=30（GOODがDEGRADEDを超える）は整合性チェックに不合格', () => {
  const r = validateGroupConsistency('GPS_ACCURACY', { GOOD: 31, DEGRADED: 30 });
  assertEqual(r.valid, false, 'valid');
});

test('localStorage上でGPS_ACCURACYが矛盾している場合、config.js読み込み時に初期値へ戻る', async () => {
  localStorage.setItem('jibunnavi_base_settings_v1', JSON.stringify({ GPS_ACCURACY: { GOOD: 100, DEGRADED: 30 } }));
  try {
    const mod = await import('../js/config.js?consistency_test=' + Date.now());
    assertEqual(mod.GPS_ACCURACY.GOOD, 15, 'GOODが初期値(15)に戻っていること');
    assertEqual(mod.GPS_ACCURACY.DEGRADED, 30, 'DEGRADEDも初期値(30)のままであること');
  } finally {
    localStorage.removeItem('jibunnavi_base_settings_v1');
  }
});

// ---------- canStartNav ----------
test('目的地未設定ではナビ開始できない', () => {
  const r = canStartNav({ destination: null, position: { lat: 1, lon: 1 } });
  assertEqual(r.ok, false, 'ok');
});

test('現在地未取得ではナビ開始できない', () => {
  const r = canStartNav({ destination: { lat: 1, lon: 1 }, position: null });
  assertEqual(r.ok, false, 'ok');
});

test('目的地・現在地とも揃っていればナビ開始できる', () => {
  const r = canStartNav({ destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 } });
  assertEqual(r.ok, true, 'ok');
});

// ---------- navSession（ナビ開始/終了の状態遷移） ----------
test('目的地未設定ではfetchRouteが呼ばれない', async () => {
  let calls = 0;
  const session = createNavSession({ fetchRouteFn: async () => { calls++; return {}; } });
  const r = await session.start({ destination: null, position: { lat: 1, lon: 1 }, token: 't' });
  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'guard', 'phase');
  assertEqual(calls, 0, 'fetchRoute呼び出し回数');
});

test('現在地未取得ではfetchRouteが呼ばれない', async () => {
  let calls = 0;
  const session = createNavSession({ fetchRouteFn: async () => { calls++; return {}; } });
  const r = await session.start({ destination: { lat: 1, lon: 1 }, position: null, token: 't' });
  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'guard', 'phase');
  assertEqual(calls, 0, 'fetchRoute呼び出し回数');
});

test('ルート取得中は開始ボタンが無効になる（onLoadingStartが呼ばれる）', async () => {
  let loadingStartCalled = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });
  await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onLoadingStart: () => { loadingStartCalled = true; } }
  );
  assertEqual(loadingStartCalled, true, 'onLoadingStartが呼ばれたこと');
});

test('連打してもfetchRouteは1回だけ呼ばれる', async () => {
  let calls = 0;
  let resolveFetch;
  const session = createNavSession({
    fetchRouteFn: () => { calls++; return new Promise((resolve) => { resolveFetch = resolve; }); }
  });
  const args = { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' };

  const first = session.start(args); // 1回目：取得中のまま止める
  const second = session.start(args); // 2回目：連打（busyで弾かれるはず）

  const secondResult = await second;
  assertEqual(secondResult.started, false, '2回目のstarted');
  assertEqual(secondResult.phase, 'busy', '2回目のphase');
  assertEqual(calls, 1, 'fetchRoute呼び出し回数は1回のみ');

  resolveFetch({ steps: [] });
  await first;
});

test('ルート取得成功後だけnavSessionの状態がactiveになり、onSuccessが呼ばれる', async () => {
  const fakeRoute = { steps: [] };
  let successRoute = null;
  let failureCalled = false;
  const session = createNavSession({ fetchRouteFn: async () => fakeRoute });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: (route) => { successRoute = route; }, onFailure: () => { failureCalled = true; } }
  );

  assertEqual(r.started, true, 'started');
  assertEqual(session.getState(), 'active', 'state');
  assertEqual(successRoute, fakeRoute, 'onSuccessに渡されたroute');
  assertEqual(failureCalled, false, 'onFailureは呼ばれないこと');
});

test('ルート取得失敗後はstateがidleに戻り、onFailureが呼ばれ、onSuccessは呼ばれない', async () => {
  let successCalled = false;
  let failureErr = null;
  const session = createNavSession({ fetchRouteFn: async () => { throw new Error('network down'); } });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: () => { successCalled = true; }, onFailure: (err) => { failureErr = err; } }
  );

  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'fetch-error', 'phase');
  assertEqual(session.getState(), 'idle', '失敗後はidleに戻ること');
  assertEqual(successCalled, false, 'onSuccessは呼ばれないこと');
  assertEqual(failureErr.message, 'network down', 'onFailureに渡されたエラー内容');
});

// ---------- navSession：asyncなonSuccessをawaitしているか ----------
test('asyncなonSuccessが正常終了した場合、完了後にstateがactiveになりstarted:trueになる', async () => {
  let onSuccessResolved = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: async () => { await new Promise((res) => setTimeout(res, 10)); onSuccessResolved = true; } }
  );

  assertEqual(onSuccessResolved, true, 'onSuccessが完了していること');
  assertEqual(r.started, true, 'started');
  assertEqual(session.getState(), 'active', 'state');
});

test('asyncなonSuccessがエラーを投げた場合、失敗扱いになりstateがidleへ戻り、未処理のPromiseエラーが発生しない', async () => {
  let unhandled = null;
  const onUnhandled = (e) => { unhandled = e.reason; };
  window.addEventListener('unhandledrejection', onUnhandled);

  let failureErr = null;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    {
      onSuccess: async () => { throw new Error('drawRoute failed'); },
      onFailure: (err) => { failureErr = err; }
    }
  );

  // unhandledrejectionは非同期に発火することがあるため少し待ってから確認する
  await new Promise((res) => setTimeout(res, 30));
  window.removeEventListener('unhandledrejection', onUnhandled);

  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'fetch-error', 'phase');
  assertEqual(session.getState(), 'idle', 'state');
  assertEqual(failureErr?.message, 'drawRoute failed', 'onFailureに渡されたエラー');
  assertEqual(unhandled, null, '未処理のPromiseエラーが発生していないこと');
});

test('onSuccessの完了前はstateがactiveにならない（start()のPromiseも完了しない）', async () => {
  let resolveOnSuccess;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const startPromise = session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: () => new Promise((res) => { resolveOnSuccess = res; }) }
  );

  await new Promise((res) => setTimeout(res, 20));
  assertEqual(session.getState(), 'loading', 'onSuccess完了前はloadingのままであること');

  resolveOnSuccess();
  const r = await startPromise;
  assertEqual(session.getState(), 'active', 'onSuccess完了後はactiveになること');
  assertEqual(r.started, true, 'onSuccess完了後にstart()のPromiseが解決すること');
});

test('onSuccess内の後続処理(地図描画等)が失敗した場合、main.js相当のロールバックが実行される', async () => {
  // main.jsのonSuccessは「navActiveを先にtrueにする→後続処理」という順序のため、
  // ここでも同じ順序を模して、失敗時にonFailureで確実に戻ることを確認する。
  let navActiveSimulated = false;
  let rolledBack = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    {
      onSuccess: async () => {
        navActiveSimulated = true;
        throw new Error('drawRoute failed'); // 地図描画相当の失敗をシミュレート
      },
      onFailure: () => {
        navActiveSimulated = false;
        rolledBack = true;
      }
    }
  );

  assertEqual(navActiveSimulated, false, '失敗後はnavActive相当がfalseに戻っていること');
  assertEqual(rolledBack, true, 'onFailureによるロールバックが実行されたこと');
});

// ---------- renderDestResultItem（XSS安全性） ----------
test('検索結果の施設名にHTML文字列が含まれてもHTMLとして解釈されない', () => {
  const malicious = { name: '<img src=x onerror="window.__xssFired = true">', address: '<script>window.__xssFired2 = true<\/script>' };
  const sandbox = document.getElementById('sandbox');
  sandbox.innerHTML = '';
  const li = renderDestResultItem(malicious, () => {});
  sandbox.appendChild(li);

  assertEqual(sandbox.querySelectorAll('img').length, 0, 'imgタグが実体化していないこと');
  assertEqual(sandbox.querySelectorAll('script').length, 0, 'scriptタグが実体化していないこと');
  assertEqual(window.__xssFired, undefined, 'onerrorが発火していないこと');
  const nameEl = li.querySelector('.dr-name');
  assertEqual(nameEl.textContent, malicious.name, '文字列としてそのまま表示されていること');
});

test('検索結果はクリックでonSelectが呼ばれる', () => {
  let selected = null;
  const result = { name: 'テスト地点', address: 'テスト住所' };
  const li = renderDestResultItem(result, (r) => { selected = r; });
  li.click();
  assertEqual(selected, result, 'onSelectに渡された値');
});

// ---------- 実行 ----------
function assertEqual(actual, expected, label) {
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (!pass) {
    throw new Error(`${label}: expected=${JSON.stringify(expected)} actual=${JSON.stringify(actual)}`);
  }
}

async function run() {
  const body = document.getElementById('resultBody');
  let passCount = 0;

  for (let i = 0; i < cases.length; i++) {
    const c = cases[i];
    let pass = true;
    let detail = 'OK';
    try {
      await c.fn();
    } catch (e) {
      pass = false;
      detail = e.message;
    }
    if (pass) passCount++;

    const tr = document.createElement('tr');
    tr.className = pass ? 'pass' : 'fail';
    const cells = [String(i + 1), c.description, pass ? 'PASS' : 'FAIL', detail];
    cells.forEach((text, idx) => {
      const td = document.createElement('td');
      if (idx === 3) td.className = 'detail';
      if (idx === 2) td.className = 'result';
      td.textContent = text;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }

  const summary = document.getElementById('summary');
  summary.textContent = `${passCount} / ${cases.length} 件パス`;
  summary.className = passCount === cases.length ? 'pass' : 'fail';
}

run();
</script>
</body>
</html>

test('REROUTE.MIN_INTERVAL_SECONDS=10（境界値）は保存される', () => {

test('空欄は保存されない', () => {

// ---------- navSession（ナビ開始/終了の状態遷移） ----------
test('目的地未設定ではfetchRouteが呼ばれない', async () => {
  let calls = 0;
  const session = createNavSession({ fetchRouteFn: async () => { calls++; return {}; } });
  const r = await session.start({ destination: null, position: { lat: 1, lon: 1 }, token: 't' });
  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'guard', 'phase');
  assertEqual(calls, 0, 'fetchRoute呼び出し回数');
});

test('現在地未取得ではfetchRouteが呼ばれない', async () => {
  let calls = 0;
  const session = createNavSession({ fetchRouteFn: async () => { calls++; return {}; } });
  const r = await session.start({ destination: { lat: 1, lon: 1 }, position: null, token: 't' });
  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'guard', 'phase');
  assertEqual(calls, 0, 'fetchRoute呼び出し回数');
});

test('ルート取得中は開始ボタンが無効になる（onLoadingStartが呼ばれる）', async () => {
  let loadingStartCalled = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });
  await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onLoadingStart: () => { loadingStartCalled = true; } }
  );
  assertEqual(loadingStartCalled, true, 'onLoadingStartが呼ばれたこと');
});

test('連打してもfetchRouteは1回だけ呼ばれる', async () => {
  let calls = 0;
  let resolveFetch;
  const session = createNavSession({
    fetchRouteFn: () => { calls++; return new Promise((resolve) => { resolveFetch = resolve; }); }
  });
  const args = { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' };

  const first = session.start(args); // 1回目：取得中のまま止める
  const second = session.start(args); // 2回目：連打（busyで弾かれるはず）

  const secondResult = await second;
  assertEqual(secondResult.started, false, '2回目のstarted');
  assertEqual(secondResult.phase, 'busy', '2回目のphase');
  assertEqual(calls, 1, 'fetchRoute呼び出し回数は1回のみ');

  resolveFetch({ steps: [] });
  await first;
});

test('ルート取得成功後だけnavSessionの状態がactiveになり、onSuccessが呼ばれる', async () => {
  const fakeRoute = { steps: [] };
  let successRoute = null;
  let failureCalled = false;
  const session = createNavSession({ fetchRouteFn: async () => fakeRoute });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: (route) => { successRoute = route; }, onFailure: () => { failureCalled = true; } }
  );

  assertEqual(r.started, true, 'started');
  assertEqual(session.getState(), 'active', 'state');
  assertEqual(successRoute, fakeRoute, 'onSuccessに渡されたroute');
  assertEqual(failureCalled, false, 'onFailureは呼ばれないこと');
});

test('ルート取得失敗後はstateがidleに戻り、onFailureが呼ばれ、onSuccessは呼ばれない', async () => {
  let successCalled = false;
  let failureErr = null;
  const session = createNavSession({ fetchRouteFn: async () => { throw new Error('network down'); } });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: () => { successCalled = true; }, onFailure: (err) => { failureErr = err; } }
  );

  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'fetch-error', 'phase');
  assertEqual(session.getState(), 'idle', '失敗後はidleに戻ること');
  assertEqual(successCalled, false, 'onSuccessは呼ばれないこと');
  assertEqual(failureErr.message, 'network down', 'onFailureに渡されたエラー内容');
});

// ---------- navSession：asyncなonSuccessをawaitしているか ----------
test('asyncなonSuccessが正常終了した場合、完了後にstateがactiveになりstarted:trueになる', async () => {
  let onSuccessResolved = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: async () => { await new Promise((res) => setTimeout(res, 10)); onSuccessResolved = true; } }
  );

  assertEqual(onSuccessResolved, true, 'onSuccessが完了していること');
  assertEqual(r.started, true, 'started');
  assertEqual(session.getState(), 'active', 'state');
});

test('asyncなonSuccessがエラーを投げた場合、失敗扱いになりstateがidleへ戻り、未処理のPromiseエラーが発生しない', async () => {
  let unhandled = null;
  const onUnhandled = (e) => { unhandled = e.reason; };
  window.addEventListener('unhandledrejection', onUnhandled);

  let failureErr = null;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const r = await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    {
      onSuccess: async () => { throw new Error('drawRoute failed'); },
      onFailure: (err) => { failureErr = err; }
    }
  );

  // unhandledrejectionは非同期に発火することがあるため少し待ってから確認する
  await new Promise((res) => setTimeout(res, 30));
  window.removeEventListener('unhandledrejection', onUnhandled);

  assertEqual(r.started, false, 'started');
  assertEqual(r.phase, 'fetch-error', 'phase');
  assertEqual(session.getState(), 'idle', 'state');
  assertEqual(failureErr?.message, 'drawRoute failed', 'onFailureに渡されたエラー');
  assertEqual(unhandled, null, '未処理のPromiseエラーが発生していないこと');
});

test('onSuccessの完了前はstateがactiveにならない（start()のPromiseも完了しない）', async () => {
  let resolveOnSuccess;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  const startPromise = session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    { onSuccess: () => new Promise((res) => { resolveOnSuccess = res; }) }
  );

  await new Promise((res) => setTimeout(res, 20));
  assertEqual(session.getState(), 'loading', 'onSuccess完了前はloadingのままであること');

  resolveOnSuccess();
  const r = await startPromise;
  assertEqual(session.getState(), 'active', 'onSuccess完了後はactiveになること');
  assertEqual(r.started, true, 'onSuccess完了後にstart()のPromiseが解決すること');
});

test('onSuccess内の後続処理(地図描画等)が失敗した場合、main.js相当のロールバックが実行される', async () => {
  // main.jsのonSuccessは「navActiveを先にtrueにする→後続処理」という順序のため、
  // ここでも同じ順序を模して、失敗時にonFailureで確実に戻ることを確認する。
  let navActiveSimulated = false;
  let rolledBack = false;
  const session = createNavSession({ fetchRouteFn: async () => ({ steps: [] }) });

  await session.start(
    { destination: { lat: 1, lon: 1 }, position: { lat: 2, lon: 2 }, token: 't' },
    {
      onSuccess: async () => {
        navActiveSimulated = true;
        throw new Error('drawRoute failed'); // 地図描画相当の失敗をシミュレート
      },
      onFailure: () => {
        navActiveSimulated = false;
        rolledBack = true;
      }
    }
  );

  assertEqual(navActiveSimulated, false, '失敗後はnavActive相当がfalseに戻っていること');
  assertEqual(rolledBack, true, 'onFailureによるロールバックが実行されたこと');
});

// ---------- arrivalJudge（到着の瞬間判定） ----------
const ARRIVAL_CFG = { RADIUS_M: 30, MAX_GPS_ACCURACY_M: 30, MAX_SPEED_MPS: 8 };
test('到着判定: 直線距離・GPS精度・速度すべて条件内なら到着範囲内', () => {
  const r = isWithinArrivalRange({ straightLineDistanceM: 10, routeRemainingDistanceM: 10, speedMPS: 1, gpsAccuracyM: 10 }, ARRIVAL_CFG);
  assertEqual(r, true, '到着範囲内');
});
test('到着判定: GPS精度が悪い(取得不可)場合は近距離でも到着扱いにしない', () => {
  const r = isWithinArrivalRange({ straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: null }, ARRIVAL_CFG);
  assertEqual(r, false, 'GPS精度不明では到着としない');
});
test('到着判定: GPS精度がMAX_GPS_ACCURACY_Mを超える場合は到着扱いにしない', () => {
  const r = isWithinArrivalRange({ straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 50 }, ARRIVAL_CFG);
  assertEqual(r, false, 'GPS精度が悪いので到着としない');
});
test('到着判定: 速度が速すぎる場合（通過中）は到着扱いにしない', () => {
  const r = isWithinArrivalRange({ straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 20, gpsAccuracyM: 10 }, ARRIVAL_CFG);
  assertEqual(r, false, '速すぎるので到着としない');
});
test('到着判定: 直線距離が範囲外なら到着扱いにしない', () => {
  const r = isWithinArrivalRange({ straightLineDistanceM: 100, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 10 }, ARRIVAL_CFG);
  assertEqual(r, false, '直線距離が遠い');
});

// ---------- arrivalTracker（到着の継続時間管理） ----------
test('到着トラッカー: 範囲内に入った直後は到着と判定しない（継続時間不足）', () => {
  const tracker = createArrivalTracker({ RADIUS_M: 30, MAX_GPS_ACCURACY_M: 30, MAX_SPEED_MPS: 8, SUSTAIN_SECONDS: 5 });
  const snap = { straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 10 };
  const r = tracker.update(snap, 1000);
  assertEqual(r, false, '継続時間不足でまだ到着していない');
});
test('到着トラッカー: SUSTAIN_SECONDS経過後にtrueになる', () => {
  const tracker = createArrivalTracker({ RADIUS_M: 30, MAX_GPS_ACCURACY_M: 30, MAX_SPEED_MPS: 8, SUSTAIN_SECONDS: 5 });
  const snap = { straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 10 };
  tracker.update(snap, 1000);
  const r = tracker.update(snap, 6001);
  assertEqual(r, true, '5秒経過後は到着');
});
test('到着トラッカー: 途中で範囲外に出ると継続時間がリセットされる', () => {
  const tracker = createArrivalTracker({ RADIUS_M: 30, MAX_GPS_ACCURACY_M: 30, MAX_SPEED_MPS: 8, SUSTAIN_SECONDS: 5 });
  const within = { straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 10 };
  const outside = { straightLineDistanceM: 100, routeRemainingDistanceM: 100, speedMPS: 0, gpsAccuracyM: 10 };
  tracker.update(within, 1000);
  tracker.update(outside, 2000); // 範囲外に出てリセット
  const r = tracker.update(within, 6500); // 再突入後まだ5秒経っていない
  assertEqual(r, false, '範囲外を挟むと継続時間がリセットされ、到着していない');
});
test('到着トラッカー: GPS精度が悪いまま近距離を維持しても到着と誤判定しない', () => {
  const tracker = createArrivalTracker({ RADIUS_M: 30, MAX_GPS_ACCURACY_M: 30, MAX_SPEED_MPS: 8, SUSTAIN_SECONDS: 5 });
  const badGps = { straightLineDistanceM: 5, routeRemainingDistanceM: 5, speedMPS: 0, gpsAccuracyM: 999 };
  tracker.update(badGps, 1000);
  const r = tracker.update(badGps, 10000);
  assertEqual(r, false, 'GPS精度が悪いままでは到着しない');
});

// ---------- voiceDecision（標準の右左折案内の発話タイミング・文言） ----------
test('voiceDecision: 一般道で700m以内に入ると"700"キーの案内を返す', () => {
  const r = decideDistanceAnnouncement({ distanceToManeuverM: 650, roadClass: 'primary', speedMPS: 10, announcedKeys: new Set() });
  assertEqual(r?.key, '700', '700mキー');
});
test('voiceDecision: 一度案内した距離段階は再度案内しない（重複防止）', () => {
  const announced = new Set(['700']);
  const r = decideDistanceAnnouncement({ distanceToManeuverM: 650, roadClass: 'primary', speedMPS: 10, announcedKeys: announced });
  assertEqual(r, null, '700mは既に案内済みなのでnull');
});
test('voiceDecision: 高速道路では2000/1000/500mのしきい値を使う', () => {
  const r = decideDistanceAnnouncement({ distanceToManeuverM: 1800, roadClass: 'motorway', speedMPS: 25, announcedKeys: new Set() });

// ---------- apiRetryPolicy（再試行回数の上限） ----------
test('apiRetryPolicy: MAX_ATTEMPTS回までは再試行を許可する', () => {
  const policy = createApiRetryPolicy({ MAX_ATTEMPTS: 3, INTERVAL_SECONDS: 5 });
  let now = 0;
  for (let i = 0; i < 3; i++) {
    const check = policy.canRetry(now);
    assertEqual(check.ok, true, `${i + 1}回目は許可される`);
    policy.recordAttempt(now);
    now += 6000; // INTERVAL_SECONDSより十分空ける
  }
});
test('apiRetryPolicy: MAX_ATTEMPTSを超えると再試行を拒否する（無制限リトライ＝課金事故の防止）', () => {
  const policy = createApiRetryPolicy({ MAX_ATTEMPTS: 3, INTERVAL_SECONDS: 5 });
  let now = 0;
  for (let i = 0; i < 3; i++) { policy.recordAttempt(now); now += 6000; }
  const check = policy.canRetry(now);
  assertEqual(check.ok, false, '上限超過');
  assertEqual(check.reason, 'max-attempts', '理由はmax-attempts');
});
test('apiRetryPolicy: 最短間隔より早い再試行は拒否する', () => {
  const policy = createApiRetryPolicy({ MAX_ATTEMPTS: 3, INTERVAL_SECONDS: 5 });
  policy.recordAttempt(0);
  const check = policy.canRetry(1000); // 5秒経っていない
  assertEqual(check.ok, false, '間隔不足');
  assertEqual(check.reason, 'too-soon', '理由はtoo-soon');
});
test('apiRetryPolicy: reset()すると再試行回数がクリアされる', () => {
  const policy = createApiRetryPolicy({ MAX_ATTEMPTS: 3, INTERVAL_SECONDS: 5 });
  let now = 0;
  for (let i = 0; i < 3; i++) { policy.recordAttempt(now); now += 6000; }
  policy.reset();
  const check = policy.canRetry(now);
  assertEqual(check.ok, true, 'reset後は再試行できる');
});

// ---------- 距離音声案内の逆戻り防止 ----------
test('voiceDecision: 20mから開始すると「まもなく」だけを発話し、700/300/100は消費されて二度と鳴らない', () => {
  const announced = new Set();
  const first = decideDistanceAnnouncement({ distanceToManeuverM: 20, roadClass: 'primary', speedMPS: 0, announcedKeys: announced });
  assertEqual(first?.key, 'immediate', '最初は「まもなく」だけ');
  announced.add(first.key);
  (first.consumedKeys ?? []).forEach((k) => announced.add(k));
  assertEqual([...announced].sort(), ['100', '300', '700', 'immediate'], '700/300/100も消費済みになる');

  // 距離が離れた場合（GPSのブレ等）でも、消費済みの段階は二度と発話されない
  [80, 250, 400, 650].forEach((d) => {
    const r = decideDistanceAnnouncement({ distanceToManeuverM: d, roadClass: 'primary', speedMPS: 0, announcedKeys: announced });
    assertEqual(r, null, `距離${d}mでも再発話しない`);
  });
});

test('voiceDecision: 250mから開始した場合、700m案内は発話しない（すでに通過済みとして消費される）', () => {
  const announced = new Set();
  const r = decideDistanceAnnouncement({ distanceToManeuverM: 250, roadClass: 'primary', speedMPS: 10, announcedKeys: announced });
  assertEqual(r?.key, '300', '一番近い300のみ発話される');

// ---------- destinationHistory（目的地の検索履歴、純粋関数部分） ----------
test('mergeIntoHistory: 空の履歴に追加すると1件になる', () => {
  const r = mergeIntoHistory([], { name: '北上駅', address: '岩手県北上市' });
  assertEqual(r.length, 1, '件数');
  assertEqual(r[0].name, '北上駅', '内容');
});
test('mergeIntoHistory: 同じ目的地(name+address一致)を再度追加すると重複せず先頭に移動する', () => {
  const existing = [
    { name: 'A', address: '住所A' },
    { name: '北上駅', address: '岩手県北上市' },
    { name: 'B', address: '住所B' }
  ];
  const r = mergeIntoHistory(existing, { name: '北上駅', address: '岩手県北上市' });
  assertEqual(r.length, 3, '件数は増えない（重複除去）');
  assertEqual(r[0].name, '北上駅', '先頭に移動している');
  assertEqual(r.filter((d) => d.name === '北上駅').length, 1, '重複していない');
});
test('mergeIntoHistory: name/addressどちらかが違えば別の目的地として扱う', () => {
  const existing = [{ name: '北上駅', address: '岩手県北上市A' }];
  const r = mergeIntoHistory(existing, { name: '北上駅', address: '岩手県北上市B' });
  assertEqual(r.length, 2, '別の目的地として追加される（同名でも住所が違う）');
});
test('mergeIntoHistory: 上限(maxLength)を超えたら古いものから切り捨てる', () => {
  const existing = [{ name: 'A' }, { name: 'B' }, { name: 'C' }];
  const r = mergeIntoHistory(existing, { name: 'D' }, 3);
  assertEqual(r.length, 3, '上限3件を超えない');
  assertEqual(r.map((d) => d.name), ['D', 'A', 'B'], '新しいものが先頭、一番古い(C)が切り捨てられる');
});

test('toggleInFavorites: 既にお気に入りの項目を渡すと取り除かれる', () => {

test('excludeFavorites: お気に入りに含まれる項目は履歴側から除外される', () => {

// ---------- 実行 ----------
function assertEqual(actual, expected, label) {
  const pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (!pass) {
    throw new Error(`${label}: expected=${JSON.stringify(expected)} actual=${JSON.stringify(actual)}`);
  }
}

async function run() {
  const body = document.getElementById('resultBody');
  let passCount = 0;

  for (let i = 0; i < cases.length; i++) {
    const c = cases[i];
    let pass = true;
    let detail = 'OK';
    try {
      await c.fn();
    } catch (e) {
      pass = false;
      detail = e.message;
    }
    if (pass) passCount++;

    const tr = document.createElement('tr');
    tr.className = pass ? 'pass' : 'fail';
    const cells = [String(i + 1), c.description, pass ? 'PASS' : 'FAIL', detail];
    cells.forEach((text, idx) => {
      const td = document.createElement('td');
      if (idx === 3) td.className = 'detail';
      if (idx === 2) td.className = 'result';
      td.textContent = text;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  }

  const summary = document.getElementById('summary');
  summary.textContent = `${passCount} / ${cases.length} 件パス`;
  summary.className = passCount === cases.length ? 'pass' : 'fail';
}

run();
</script>

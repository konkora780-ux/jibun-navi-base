<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="じぶんNaviベース">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>じぶんNaviベース - Phase 1</title>

<!--
  Mapbox GL JS / Turf.js はバージョンを固定しています（理由はREADME.md参照）。
  更新する場合は、地図・3D地形・ルート追跡（Turf.js）が問題なく動くことを
  確認してから、CSSとJSのバージョン番号を両方揃えて変更してください。
-->
<link href="https://unpkg.com/mapbox-gl@3.28.1/dist/mapbox-gl.css" rel="stylesheet">
<script src="https://unpkg.com/mapbox-gl@3.28.1/dist/mapbox-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@7.4.0/turf.min.js"></script>

<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="app">

  <!-- 地図は常に全画面。他のUIはこの上に浮かせる（フローティングUI） -->
  <div id="map"></div>

  <!-- 上部バー（浮かせる） -->
  <header id="topbar">
    <div id="destWrap">
      <input id="destInput" type="text" placeholder="目的地を検索" aria-label="目的地を検索">
      <ul id="destResults" class="hidden" role="listbox" aria-label="検索候補"></ul>
    </div>
    <button id="btnSearch">検索</button>
    <button id="btnVoiceSearch" class="toggle" title="音声で検索" aria-label="音声で検索" aria-pressed="false">🎤</button>
    <button id="btnStart" class="toggle" aria-pressed="false">ナビ開始</button>
    <button id="btnRecenter" class="toggle" title="現在地に戻る" aria-label="現在地に戻る">現在地</button>
    <button id="btn3d" class="toggle" aria-pressed="true">3D</button>
    <button id="btnDebug" class="toggle active" aria-pressed="true">DEBUG</button>
    <select id="testRouteId" title="テストルート">
      <option value="other">ルート未選択</option>
      <option value="kitakami_city">北上市内</option>
      <option value="kitakami_kamaishi">北上〜釜石</option>
      <option value="tono_city">遠野市内</option>
      <option value="tohoku_expressway">東北自動車道</option>
      <option value="morioka_city">盛岡市内</option>
    </select>
  </header>

  <!-- DEBUGパネル（浮かせる） -->
  <aside id="debugPanel">
    <h2>DEBUG</h2>
    <dl>
      <dt>状態</dt>        <dd id="dbgStatus">起動中</dd>
      <dt>GPS</dt>         <dd id="dbgGps">—</dd>
      <dt>精度</dt>        <dd id="dbgAccuracy" class="acc-unknown">—</dd>
      <dt>速度</dt>        <dd id="dbgSpeed">—</dd>
      <dt>道路種別</dt>    <dd id="dbgRoadClass">—</dd>
      <dt>現在道路</dt>    <dd id="dbgRoadName">—</dd>
      <dt>車線数</dt>      <dd id="dbgLaneCount">—</dd>
      <dt>車線</dt>        <dd id="dbgLanes">—</dd>
      <dt>MB推奨</dt>      <dd id="dbgMapboxLanes">—</dd>
      <dt>SL推奨</dt>      <dd id="dbgSmartLanes">—</dd>
      <dt>一致</dt>        <dd id="dbgMatched">—</dd>
      <dt>次</dt>          <dd id="dbgNext">—</dd>
      <dt>次々</dt>        <dd id="dbgFollowing">—</dd>
      <dt>次の道路車線</dt><dd id="dbgNextLanes">—</dd>
      <dt>信頼度</dt>      <dd id="dbgConfidence">—</dd>
      <dt>取得不可</dt>    <dd id="dbgMissing" class="warn">—</dd>
    </dl>
    <div id="logControls">
      <button id="btnLogExport">ログ書き出し</button>
      <button id="btnLogClear">ログ削除</button>
      <a id="btnStats" href="stats.html" target="_blank" rel="noopener">集計を開く</a>
      <a id="btnSettings" href="settings.html" target="_blank" rel="noopener">設定を開く</a>
    </div>
  </aside>

  <!-- 実走用ナビ案内パネル（浮かせる）。DEBUGパネルとは完全に別。 -->
  <footer id="guidebar">
    <div id="navStatusBanner" class="hidden" role="status"></div>
    <div id="navMainRow">
      <div id="navIcon" class="nav-icon"></div>
      <div id="navInfo">
        <div id="navDistance" class="nav-distance"></div>
        <div id="navRoadName" class="nav-road-name">ナビ未開始</div>
        <div id="navSmartLaneText" class="nav-smartlane-text"></div>
      </div>
    </div>
    <div id="navLanes" class="nav-lanes"></div>
    <div id="navSummaryRow">
      <span id="navEta">—</span>
      <span id="navRemainingTime"></span>
      <span id="navRemainingDistance"></span>
    </div>
  </footer>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
